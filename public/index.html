<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Krysoc</title>
    <meta name="robots" content="noindex" />
    <link rel="alternate" hreflang="en" href="https://krysoc.com/en/" />
    <link rel="alternate" hreflang="de" href="https://krysoc.com/de/" />
    <style>
      html { background: #0a0907; }
    </style>
    <script>
      var lang =
        (navigator.languages && navigator.languages[0]) ||
        navigator.language ||
        "en";
      window.location.replace(/^de\b/i.test(lang) ? "/de/" : "/en/");
    </script>
    <meta http-equiv="refresh" content="1;url=/en/" />
  </head>
  <body></body>
</html>
